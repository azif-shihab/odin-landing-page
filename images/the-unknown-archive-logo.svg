<svg xmlns="http://www.w3.org/2000/svg" width="300" height="40" viewBox="0 0 300 40">
  <title>The Unknown Archive</title>
  <desc>Dark minimalist logo featuring an archival portal icon and the words The Unknown Archive.</desc>

  <!-- Transparent background -->
  <g fill="none" stroke="#F2F0EA" stroke-width="1.35" stroke-linejoin="miter">
    <!-- Open archive / portal -->
    <path d="M3.5 7.5 L7.2 6.0 L7.2 33.8 L3.5 35.5 Z"/>
    <path d="M7.2 6.0 L11.0 7.5 L11.0 32.0 L7.2 33.8 Z"/>
    <path d="M11.0 7.5 L17.5 11.0 L24.0 7.5 L24.0 32.0 L17.5 35.5 L11.0 32.0 Z"/>
    <path d="M24.0 7.5 L27.8 6.0 L27.8 33.8 L24.0 32.0 Z"/>
    <path d="M27.8 6.0 L31.5 7.5 L31.5 35.5 L27.8 33.8 Z"/>

    <!-- Perspective archive floor -->
    <path d="M14.0 29.7 L21.0 29.7"/>
    <path d="M13.0 26.8 L22.0 26.8"/>
    <path d="M12.0 23.9 L23.0 23.9"/>
    <path d="M11.1 21.1 L23.9 21.1"/>
  </g>

  <!-- Portal star -->
  <path fill="#F2F0EA" d="M17.5 14.1 L18.25 16.25 L20.4 17 L18.25 17.75 L17.5 19.9 L16.75 17.75 L14.6 17 L16.75 16.25 Z"/>

  <!-- Wordmark -->
  <g fill="#F2F0EA" font-family="Georgia, 'Times New Roman', serif" dominant-baseline="middle">
    <text x="36" y="20.7" font-size="5.2" letter-spacing="1.35">THE</text>
    <text x="52" y="20.2" font-size="11.8" letter-spacing="0.15">UNKNOWN</text>
    <text x="143" y="20.7" font-size="5.2" letter-spacing="1.35">ARCHIVE</text>
  </g>
</svg>
